<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인형 옷입히기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="play-area" aria-label="캐릭터 화면">
      <div class="top-actions">
        <button class="square-button" id="backButton" type="button" aria-label="한 단계 되돌리기">
          <img src="imgchange.png" alt="">
        </button>
        <button class="reset-button" id="resetButton" type="button" aria-label="처음 상태로">
          <img src="resetGame.png" alt="">
        </button>
      </div>

      <div class="stage" id="stage">
        <img class="background" id="background" alt="">
        <button class="stage-arrow stage-arrow-left" id="prevBackground" type="button" aria-label="이전 배경">&lsaquo;</button>
        <button class="stage-arrow stage-arrow-right" id="nextBackground" type="button" aria-label="다음 배경">&rsaquo;</button>

        <div class="doll doll-left" id="leftDoll" data-side="left" aria-label="왼쪽 캐릭터">
          <img class="layer base" id="leftBase" alt="">
          <img class="layer outfit" id="leftOutfit" alt="">
          <img class="layer event-clothes" id="leftEventClothes" alt="">
          <img class="layer event-face" id="leftEventFace" alt="">
        </div>

        <div class="doll doll-right" id="rightDoll" data-side="right" aria-label="오른쪽 캐릭터">
          <img class="layer base" id="rightBase" alt="">
          <img class="layer outfit" id="rightOutfit" alt="">
          <img class="layer event-clothes" id="rightEventClothes" alt="">
          <img class="layer event-face" id="rightEventFace" alt="">
        </div>

        <div class="dialogue" id="dialogue" aria-live="polite">
          <span id="dialogueText">이벤트 발생</span>
          <button id="dialogueClose" type="button" aria-label="다음 대사">▾</button>
        </div>
      </div>
    </section>

    <section class="closet" aria-label="옷장">
      <div class="closet-side" id="leftCloset">
        <div class="closet-title">
          <span>왼쪽 옷장</span>
          <small>왼쪽 인물에게 드래그</small>
        </div>
        <div class="closet-rail" aria-hidden="true"></div>
        <div class="closet-grid" id="leftClosetGrid"></div>
      </div>

      <div class="closet-side" id="rightCloset">
        <div class="closet-title">
          <span>오른쪽 옷장</span>
          <small>오른쪽 인물에게 드래그</small>
        </div>
        <div class="closet-rail" aria-hidden="true"></div>
        <div class="closet-grid" id="rightClosetGrid"></div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
